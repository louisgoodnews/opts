[package]
name = "opts-bevy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Bevy plugin and asset loaders for OPTS."
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Internal
opts-core = { workspace = true }
opts-sim = { workspace = true }
opts-traffic = { workspace = true }
opts-gui = { workspace = true }
opts-cli = { workspace = true }
opts-logging = { workspace = true }
opts-debounce = { workspace = true }
opts-position-tag = { workspace = true }
opts-audio = { workspace = true }
opts-light-quality = { workspace = true }
opts-light-quality-core = { workspace = true }
opts-main-camera = { workspace = true }
opts-scene-trace = { workspace = true }
opts-spatial-zones = { workspace = true }
# Bevy-facing leaves split out of opts-bevy (ISS-065 stage 2).
opts-bevy-bus-stops = { workspace = true }
opts-bevy-ground = { workspace = true }
opts-bevy-instancing = { workspace = true }
opts-bevy-moon-material = { workspace = true }
opts-bevy-season = { workspace = true }
opts-bevy-texture-sentinel = { workspace = true }

# Bevy Ecosystem
bevy = { workspace = true }

# Image & Asset Handling
image = { workspace = true }
ddsfile = { workspace = true }
# Mip chains of block-compressed textures (M-0058): BC1/2/3 encoder, pure Rust; content hash
# of the derived chain cache.
texpresso = "2.0"
sha2 = "0.10"
directories = { workspace = true }
chrono = { workspace = true }
# Screen capture: AV1 encoder (the feature set the image crate already builds: pure Rust, no nasm)
# and free-disk-space checks.
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
sysinfo = { version = "0.39", default-features = false, features = ["disk"] }

# Serialization (control protocol)
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = "0.2"
notify = { workspace = true }

# Logging & Error Handling
tracing = { workspace = true }
thiserror = { workspace = true }

[features]
# Streaming pipeline timers (`opts_logging::stream_trace`, M-0089); zero cost when off.
stream-trace = ["opts-logging/stream-trace"]

[dev-dependencies]
opts-cli = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }