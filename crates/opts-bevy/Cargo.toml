[package]
name = "opts-bevy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bevy plugin and asset loaders for OPTS."
repository.workspace = true

[dependencies]
# Internal
opts-core = { workspace = true }
opts-sim = { workspace = true }
opts-gui = { workspace = true }
opts-cli = { workspace = true }
opts-logging = { workspace = true }

# Bevy Ecosystem
bevy = { workspace = true }
# bevy_asset_loader = { workspace = true } # Uncomment when needed

# Image & Asset Handling
image = { workspace = true }
ddsfile = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }

# Serialization (control protocol)
serde_json = { workspace = true }
smol_str = "0.2"
notify = { workspace = true }

# Logging & Error Handling
tracing = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
opts-cli = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }