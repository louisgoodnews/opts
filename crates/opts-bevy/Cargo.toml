[package]
name = "opts-bevy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Bevy plugin and asset loaders for OPTS."
repository.workspace = true

[dependencies]
# Internal
opts-core = { workspace = true }
opts-sim = { workspace = true }
opts-traffic = { workspace = true }
opts-gui = { workspace = true }
opts-cli = { workspace = true }
opts-logging = { workspace = true }

# Bevy Ecosystem
bevy = { workspace = true }

# Image & Asset Handling
image = { workspace = true }
ddsfile = { workspace = true }
directories = { workspace = true }
chrono = { workspace = true }

# Serialization (control protocol)
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = "0.2"
notify = { workspace = true }

# Logging & Error Handling
tracing = { workspace = true }
thiserror = { workspace = true }

[features]
# Streaming pipeline timers (`opts_logging::stream_trace`, M-0089); zero cost when off.
stream-trace = ["opts-logging/stream-trace"]

[dev-dependencies]
opts-cli = { workspace = true, features = ["client"] }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }