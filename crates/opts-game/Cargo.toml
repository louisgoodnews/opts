[package]
name = "opts-game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "The main executable for the Open Public Transport Simulator."
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "opts-game"
path = "src/main.rs"

[dependencies]
# Internal Crates
opts-core = { workspace = true }
opts-l10n = { workspace = true }
opts-bevy = { workspace = true }
opts-hardware = { workspace = true }
rfd = { workspace = true }
opts-gui = { workspace = true, features = ["serde"] }
opts-sim = { workspace = true }
opts-collision = { workspace = true }
opts-traffic = { workspace = true }
opts-catalogue = { workspace = true }
opts-logging = { workspace = true }
opts-steam = { workspace = true }
opts-map-advice = { workspace = true }
opts-theme-files = { workspace = true }
opts-exhaust = { workspace = true }
opts-fleet-number = { workspace = true }
opts-mesh-dir = { workspace = true }
opts-road-surf = { workspace = true }
opts-world-session = { workspace = true }

# Bevy Engine
bevy = { workspace = true }

# Serialization & Assets
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
directories = "5.0"
toml = "0.8"
thiserror = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }

# Logging & Error Handling
tracing = { workspace = true }

# CLI arguments for the game
opts-cli = { workspace = true }

[features]
# Fixtures for integration tests (miniature OMSI installation); not part of the shipped game.
test-support = []
# Bevy system spans plus `OPTS_SYSTEM_TIMING=<seconds>` per-system timing (profiling builds).
profile = ["bevy/trace", "bevy/debug"]
# Streaming pipeline timers and `OPTS_STREAM_TRACE=<file>` per-frame JSON lines (M-0089); zero cost when off.
stream-trace = ["opts-bevy/stream-trace", "opts-logging/stream-trace"]

[dev-dependencies]
# Add test-specific dependencies here

# Integration tests that use the fixtures of `test-support` (run with --features test-support).
[[test]]
name = "a11y_matrix"
path = "tests/a11y_matrix.rs"
required-features = ["test-support"]

[[test]]
name = "hud_matrix"
path = "tests/hud_matrix.rs"
required-features = ["test-support"]

[[test]]
name = "ui_rules"
path = "tests/ui_rules.rs"
required-features = ["test-support"]

[[test]]
name = "golden_screens"
path = "tests/golden_screens/main.rs"
required-features = ["test-support"]

[[test]]
name = "wizard_tests"
path = "tests/wizard_tests/main.rs"
required-features = ["test-support"]

[[test]]
name = "loading_tests"
path = "tests/loading_tests.rs"
required-features = ["test-support"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
