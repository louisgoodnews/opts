[package]
name = "opts-game"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "The main executable for the Open Public Transport Simulator."
repository.workspace = true

[[bin]]
name = "opts-game"
path = "src/main.rs"

[dependencies]
# Internal Crates
opts-core = { workspace = true }
opts-l10n = { workspace = true }
opts-bevy = { workspace = true }
opts-hardware = { workspace = true }
rfd = { workspace = true }
opts-gui = { workspace = true, features = ["serde"] }
opts-sim = { workspace = true }
opts-traffic = { workspace = true }
opts-catalogue = { workspace = true }
opts-logging = { workspace = true }

# Bevy Engine
bevy = { workspace = true }

# Serialization & Assets
serde = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
directories = "5.0"
toml = "0.8"
thiserror = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
chrono = { workspace = true }

# Logging & Error Handling
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI arguments for the game
opts-cli = { workspace = true }
clap = { workspace = true }

[features]
# Fixtures for integration tests (miniature OMSI installation); not part of the shipped game.
test-support = []
# Bevy system spans plus `OPTS_SYSTEM_TIMING=<seconds>` per-system timing (profiling builds).
profile = ["bevy/trace", "bevy/debug"]
# Streaming pipeline timers and `OPTS_STREAM_TRACE=<file>` per-frame JSON lines (M-0089); zero cost when off.
stream-trace = ["opts-bevy/stream-trace", "opts-logging/stream-trace"]

[dev-dependencies]
# Enables the fixtures for this crate's own integration tests.
opts-game = { path = ".", features = ["test-support"] }
# Add test-specific dependencies here