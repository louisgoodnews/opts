[package]
name = "opts-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Material Design 3 GUI widget library for OPTS."
repository.workspace = true

[dependencies]
# Internal
opts-core = { workspace = true }

# Bevy Ecosystem
bevy = { workspace = true }

# Error Handling, Logging, and Serialization
thiserror = { workspace = true }
tracing = { workspace = true }
arboard = { workspace = true }
chrono = { workspace = true }
# AccessKit node types; same version as `bevy_a11y` (Bevy does not re-export them)
accesskit = "0.24"
# PNG goldens of the testing module
image = { workspace = true, features = ["png"] }
serde = { workspace = true, optional = true }
ron = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "dep:ron"]

[dev-dependencies]
ab_glyph = "0.2"
