[package]
name = "opts-benchmark"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Benchmarks and corpus verification for OPTS (scenery object load verification, M-0054)."
repository.workspace = true
publish = false

[[bin]]
name = "opts-benchmark"
path = "src/main.rs"

[[example]]
# M-0058 phase A: cost and quality of mip chains for DXT textures without one.
name = "dxt_mips"
required-features = ["scenery"]

[[example]]
# Q-SB-01 probe: off-screen rendering and readback with no window.
name = "offscreen_probe"
required-features = ["scenery"]

[[bench]]
# M-0028: Criterion benchmarks of the OMSI text parsers (renderer-free, synthetic input).
name = "parsers"
harness = false

[[bench]]
# M-0028: Criterion benchmarks of the global.cfg and model.cfg parsers (synthetic).
name = "configs"
harness = false

[[bench]]
# M-0028: Criterion benchmark of the .o3d mesh parser (plain version-1 layout, synthetic).
name = "meshes"
harness = false

[[bench]]
# M-0028: Criterion benchmark of the vehicle physics step.
name = "physics"
harness = false
required-features = ["physics"]

[features]
default = ["scenery"]
# The scenery harness renders objects with the game's loader; it pulls in Bevy's renderer.
# `--no-default-features` builds only the renderer-free parts (for M-0028's Criterion benches).
scenery = ["physics", "dep:opts-game", "dep:opts-bevy", "dep:opts-catalogue", "dep:bevy"]
# The vehicle physics step (M-0028's `physics` bench) needs only the simulation crate.
physics = ["dep:opts-sim"]

[dependencies]
opts-core = { workspace = true }
opts-game = { workspace = true, optional = true }
opts-bevy = { workspace = true, optional = true }
opts-sim = { workspace = true, optional = true }
opts-catalogue = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }

anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
image = { workspace = true }
sha2 = "0.10"
globset = "0.4"
chrono = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"
# M-0058 phase A: the BC encoder measured by `examples/dxt_mips.rs`.
texpresso = "2.0"
