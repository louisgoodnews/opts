name: CI

on:
  # Every branch (the agents work on `agent/*` branches), and pull requests against any base.
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check, Test, and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for Bevy
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install --no-install-recommends -yq \
            pkg-config \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libfontconfig1-dev \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Rustdoc without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Size report (standards.md limits; informational until the splits land)
        run: python3 scripts/size_check.py

      - name: Check compilation (all targets)
        run: cargo check --workspace --all-targets

      - name: Dependency license and ban check (M-0042)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: licenses bans sources

  docs-links:
    name: Documentation links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check relative markdown links
        run: python3 scripts/check_links.py

      - name: Roadmap copies match ROADMAP.md
        run: python3 scripts/gen_roadmap_copy.py --check

      - name: Roadmap, board and phase pages agree
        run: python3 scripts/roadmap_audit.py --check

      - name: Crate graph matches the workspace
        run: python3 scripts/crate_graph.py --check

      - name: Structure and function ratchets (M-0125, M-0147)
        run: |
          python3 scripts/test_structure_audit.py
          python3 scripts/structure_audit.py check

      - name: Legacy OMSI boundary ratchet (Phase 13)
        run: python3 scripts/omsi_uses.py --check

  windows:
    name: Windows build and tests
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check (all targets)
        run: cargo check --workspace --all-targets

      # The job log needs a GitHub login; annotations are public. On failure, the failing tests and
      # their panic messages are reported as annotations of this step (M-0042): a step may carry 10
      # errors and 10 warnings, so panics after the ninth are warnings.
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt; then exit 0; fi
          failed=$(grep -E '^test .* FAILED$|^error: test failed|^error(\[E[0-9]+\])?: |^    `-p ' test-output.txt | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=cargo test failures (Windows)::${failed:-no test named; see the panics}"
          grep -n -A3 'panicked at' test-output.txt | head -120 | awk 'BEGIN{RS="--\n"} NR<=19 {gsub(/%/,"%25"); gsub(/\n/,"%0A"); lvl = NR<=9 ? "error" : "warning"; print "::" lvl " title=panic " NR " (Windows)::" substr($0,1,1500)}'
          exit 1

      # M-0081: the hardware probe has Windows-specific code paths; run its tests explicitly so a
      # failure here is named after the crate.
      - name: Hardware probe tests (Windows)
        run: cargo test -p opts-hardware

  macos:
    name: macOS build and hardware probe tests
    # macos-latest is Apple Silicon (aarch64); the Intel target is only compile-checked below.
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check the hardware probe
        run: cargo check -p opts-hardware --all-targets

      # The repository pins the toolchain (rust-toolchain.toml): targets must be added to the
      # pinned toolchain, i.e. from inside the checkout, not to `stable` by the setup action.
      - name: Add the Intel mac target to the pinned toolchain
        run: rustup target add x86_64-apple-darwin

      - name: Check the hardware probe for Intel macs
        run: cargo check -p opts-hardware --all-targets --target x86_64-apple-darwin

      - name: Run tests (hardware probe and core)
        run: cargo test -p opts-hardware -p opts-core

  hardware-targets:
    name: Hardware probe cross-target check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with the other targets
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-gnu,x86_64-pc-windows-msvc,aarch64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Add the targets to the pinned toolchain
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            rustup target add "$t"
          done
          rustup component add clippy

      - name: Clippy for every supported target (opts-hardware only; nothing is run)
        run: |
          for t in x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-pc-windows-msvc aarch64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            cargo clippy -p opts-hardware --all-targets --target "$t" -- -D warnings
          done
