[package]
name = "opts"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
authors = ["OPTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/louisgoodnews/opts"
description = "Open Public Transport Simulator - Bringing OMSI 2 assets to the Bevy engine."
default-run = "opts"

[lints]
workspace = true

[[bin]]
name = "opts"
path = "src/main.rs"

[dependencies]
opts-game = { path = "crates/opts-game" }

[workspace]
resolver = "2"
members = [
    "crates/opts-benchmark",
    "crates/opts-bevy",
    "crates/opts-car-following",
    "crates/opts-catalogue",
    "crates/opts-cli",
    "crates/opts-collision",
    "crates/opts-audio",
    "crates/opts-light-quality",
    "crates/opts-main-camera",
    "crates/opts-scene-trace",
    "crates/opts-spatial-zones",
    "crates/opts-core",
    "crates/opts-debounce",
    "crates/opts-exhaust",
    "crates/opts-game",
    "crates/opts-hardware",
    "crates/opts-importer",
    "crates/opts-l10n",
    "crates/opts-model",
    "crates/opts-omsi",
    "crates/opts-omsi-text",
    "crates/opts-omsi-binary",
    "crates/opts-omsi-vehicles",
    "crates/opts-omsi-map",
    "crates/opts-omsi-scenery",
    "crates/opts-position-tag",
    "crates/opts-types",
    "crates/opts-vdf",
    "crates/opts-theme-files",
    "crates/opts-steam",
    "crates/opts-wav",
    "crates/opts-gui",
    "crates/opts-logging",
    "crates/opts-map-advice",
    "crates/opts-sim",
    "crates/opts-tools",
    "crates/opts-traffic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1" # Minimum Supported Rust Version (MSRV): the pinned toolchain; the locked dependency set needs 1.97.1
authors = ["OPTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/louisgoodnews/opts"
description = "Open Public Transport Simulator - Bringing OMSI 2 assets to the Bevy engine."
keywords = ["bevy", "simulation", "omsi", "transport", "gamedev"]
categories = ["game-development", "simulation"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
# --- Internal Crates ---
opts-benchmark = { path = "crates/opts-benchmark" }
opts-bevy = { path = "crates/opts-bevy" }
opts-car-following = { path = "crates/opts-car-following" }
opts-catalogue = { path = "crates/opts-catalogue" }
opts-cli = { path = "crates/opts-cli", default-features = false }
opts-collision = { path = "crates/opts-collision" }
opts-audio = { path = "crates/opts-audio" }
opts-light-quality = { path = "crates/opts-light-quality" }
opts-main-camera = { path = "crates/opts-main-camera" }
opts-scene-trace = { path = "crates/opts-scene-trace" }
opts-spatial-zones = { path = "crates/opts-spatial-zones" }
opts-core = { path = "crates/opts-core" }
opts-debounce = { path = "crates/opts-debounce" }
opts-game = { path = "crates/opts-game" }
opts-hardware = { path = "crates/opts-hardware" }
opts-importer = { path = "crates/opts-importer" }
opts-l10n = { path = "crates/opts-l10n" }
opts-model = { path = "crates/opts-model" }
opts-omsi = { path = "crates/opts-omsi" }
opts-omsi-text = { path = "crates/opts-omsi-text" }
opts-omsi-binary = { path = "crates/opts-omsi-binary" }
opts-omsi-vehicles = { path = "crates/opts-omsi-vehicles" }
opts-omsi-map = { path = "crates/opts-omsi-map" }
opts-omsi-scenery = { path = "crates/opts-omsi-scenery" }
opts-position-tag = { path = "crates/opts-position-tag" }
opts-types = { path = "crates/opts-types" }
opts-vdf = { path = "crates/opts-vdf" }
opts-theme-files = { path = "crates/opts-theme-files" }
opts-steam = { path = "crates/opts-steam" }
opts-wav = { path = "crates/opts-wav" }
opts-exhaust = { path = "crates/opts-exhaust" }
opts-gui = { path = "crates/opts-gui" }
opts-map-advice = { path = "crates/opts-map-advice" }
opts-logging = { path = "crates/opts-logging" }
opts-sim = { path = "crates/opts-sim" }
opts-tools = { path = "crates/opts-tools" }
opts-traffic = { path = "crates/opts-traffic" }

# --- Bevy Ecosystem ---
# Bevy moves fast. Check the latest version before starting. 
# As of mid-2024, 0.14 is stable, but 0.15 might be out.
bevy = { version = "0.20", features = ["file_watcher", "system_font_discovery"] }

# --- Parsing & Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"                 # Rusty Object Notation for config files/save games
bincode = "1.3"             # Fast binary serialization for save games
toml = "0.8"

# --- Image & Asset Handling ---
image = "0.25"              # For loading .tga, .bmp, .jpg
ddsfile = "0.5"             # For loading OMSI's primary .dds textures
glam = "0.33"               # Math library (Bevy uses this internally)

# --- System & Diagnostics ---
anyhow = "1.0"              # For easy error handling in tools and binaries
thiserror = "1.0"           # For defining strict, typed errors in libraries
tracing = "0.1"             # Logging and diagnostics (Bevy uses this)
tracing-subscriber = "0.3"
tracing-appender = "0.2"
directories = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # local-time stamps for reports
arboard = { version = "3", default-features = false }  # System clipboard for the multiline TextArea
time = { version = "0.3", features = ["formatting", "macros"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rfd = "0.15"                # Native file dialog (xdg portal on Linux) for choosing the OMSI folder
notify = "6.1"              # File watching for hot reload
rayon = "1.10"              # Data parallelism (use carefully to maintain determinism)

# --- Profiles ---
# Bevy compiles very slowly in debug mode. These settings optimize 
# dependencies (like Bevy) while keeping your own crates fast to compile.

[profile.dev]
opt-level = 1
# Full debug info for Bevy-sized test binaries filled 600 GB of disk; line tables keep backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1