[package]
name = "opts"
version = "0.1.0"
edition = "2021"
authors = ["OPTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/louisgoodnews/opts"
description = "Open Public Transport Simulator - Bringing OMSI 2 assets to the Bevy engine."
default-run = "opts"

[[bin]]
name = "opts"
path = "src/main.rs"

[dependencies]
opts-cli = { path = "crates/opts-cli", default-features = false }
opts-game = { path = "crates/opts-game" }
opts-logging = { path = "crates/opts-logging" }
tracing = { workspace = true }

[workspace]
resolver = "2"
members = [
    "crates/opts-benchmark",
    "crates/opts-bevy",
    "crates/opts-catalogue",
    "crates/opts-cli",
    "crates/opts-core",
    "crates/opts-game",
    "crates/opts-hardware",
    "crates/opts-importer",
    "crates/opts-l10n",
    "crates/opts-model",
    "crates/opts-omsi",
    "crates/opts-types",
    "crates/opts-gui",
    "crates/opts-logging",
    "crates/opts-sim",
    "crates/opts-tools",
    "crates/opts-traffic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.76" # Minimum Supported Rust Version (MSRV)
authors = ["OPTS Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/louisgoodnews/opts"
description = "Open Public Transport Simulator - Bringing OMSI 2 assets to the Bevy engine."
keywords = ["bevy", "simulation", "omsi", "transport", "gamedev"]
categories = ["game-development", "simulation"]

[workspace.dependencies]
# --- Internal Crates ---
opts-benchmark = { path = "crates/opts-benchmark" }
opts-bevy = { path = "crates/opts-bevy" }
opts-catalogue = { path = "crates/opts-catalogue" }
opts-cli = { path = "crates/opts-cli", default-features = false }
opts-core = { path = "crates/opts-core" }
opts-game = { path = "crates/opts-game" }
opts-hardware = { path = "crates/opts-hardware" }
opts-importer = { path = "crates/opts-importer" }
opts-l10n = { path = "crates/opts-l10n" }
opts-model = { path = "crates/opts-model" }
opts-omsi = { path = "crates/opts-omsi" }
opts-types = { path = "crates/opts-types" }
opts-gui = { path = "crates/opts-gui" }
opts-logging = { path = "crates/opts-logging" }
opts-sim = { path = "crates/opts-sim" }
opts-tools = { path = "crates/opts-tools" }
opts-traffic = { path = "crates/opts-traffic" }

# --- Bevy Ecosystem ---
# Bevy moves fast. Check the latest version before starting. 
# As of mid-2024, 0.14 is stable, but 0.15 might be out.
bevy = { version = "0.20", features = ["file_watcher"] }

# --- Parsing & Serialization ---
nom = "7.1"                 # For parsing OMSI text config files (.sco, .sli, .cfg)
binrw = "0.13"              # For parsing the binary .o3d files (much better than manual byte reading)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"                 # Rusty Object Notation for config files/save games
bincode = "1.3"             # Fast binary serialization for save games
toml = "0.8"

# --- Image & Asset Handling ---
image = "0.25"              # For loading .tga, .bmp, .jpg
ddsfile = "0.5"             # For loading OMSI's primary .dds textures
glam = "0.33"               # Math library (Bevy uses this internally)
petgraph = "0.6"            # For representing the transit network graph

# --- System & Diagnostics ---
anyhow = "1.0"              # For easy error handling in tools and binaries
thiserror = "1.0"           # For defining strict, typed errors in libraries
tracing = "0.1"             # Logging and diagnostics (Bevy uses this)
tracing-subscriber = "0.3"
tracing-appender = "0.2"
directories = "5.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }  # local-time stamps for reports
arboard = { version = "3", default-features = false }  # System clipboard for the multiline TextArea
time = { version = "0.3", features = ["formatting", "macros"] }
nu-ansi-term = "0.50"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rfd = "0.15"                # Native file dialog (xdg portal on Linux) for choosing the OMSI folder
notify = "6.1"              # File watching for hot reload
rayon = "1.10"              # Data parallelism (use carefully to maintain determinism)

# --- Profiles ---
# Bevy compiles very slowly in debug mode. These settings optimize 
# dependencies (like Bevy) while keeping your own crates fast to compile.

[profile.dev]
opt-level = 1
# Full debug info for Bevy-sized test binaries filled 600 GB of disk; line tables keep backtraces.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = "thin"
codegen-units = 1